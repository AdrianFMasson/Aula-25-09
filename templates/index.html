<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1>Cadastro de Clientes</h1>

        <p id="mensagem" class="mensagem"></p>

        <form id="formCliente">
            <div class="campos">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
            </div>

            <button type="submit" id="botaoCadastrar">Cadastrar</button>
        </form>

        <div class="tabela">
            <div class="linha cabecalho">
                <strong>Nome</strong>
                <strong>E-mail</strong>
                <strong>Telefone</strong>
                <strong>Cidade</strong>
            </div>

            <div id="listaClientes"></div>
        </div>
    </main>

    <script>
        const API_URL = "/api/clientes";

        const formCliente = document.getElementById("formCliente");
        const mensagem = document.getElementById("mensagem");
        const listaClientes = document.getElementById("listaClientes");
        const botaoCadastrar = document.getElementById("botaoCadastrar");

        function mostrarMensagem(texto, tipo = "") {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;
        }

        function criarCelula(texto) {
            const elemento = document.createElement("span");
            elemento.textContent = texto ?? "";
            return elemento;
        }

        function exibirClientes(clientes) {
            listaClientes.innerHTML = "";

            clientes.forEach(cliente => {
                const linha = document.createElement("div");
                linha.className = "linha";

                linha.appendChild(criarCelula(cliente.nome));
                linha.appendChild(criarCelula(cliente.email));
                linha.appendChild(criarCelula(cliente.telefone));
                linha.appendChild(criarCelula(cliente.cidade));

                listaClientes.appendChild(linha);
            });
        }

        async function carregarClientes() {
            try {
                const resposta = await fetch(API_URL);

                if (!resposta.ok) {
                    throw new Error(`Erro HTTP ${resposta.status}`);
                }

                const clientes = await resposta.json();
                exibirClientes(clientes);
            } catch (erro) {
                console.error("Erro ao carregar clientes:", erro);

                mostrarMensagem(
                    "Não foi possível carregar os clientes.",
                    "erro"
                );
            }
        }

        formCliente.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            mostrarMensagem("");

            const dados = {
                nome: document.getElementById("nome").value.trim(),
                email: document.getElementById("email").value.trim(),
                telefone: document.getElementById("telefone").value.trim(),
                cidade: document.getElementById("cidade").value.trim()
            };

            if (!dados.nome || !dados.email || !dados.telefone || !dados.cidade) {
                mostrarMensagem(
                    "Preencha todos os campos.",
                    "erro"
                );
                return;
            }

            botaoCadastrar.disabled = true;
            botaoCadastrar.textContent = "Cadastrando...";

            try {
                console.log("Enviando:", dados);
                console.log("URL:", API_URL);

                const resposta = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });

                const texto = await resposta.text();

                let resultado;

                try {
                    resultado = texto ? JSON.parse(texto) : null;
                } catch {
                    resultado = texto;
                }

                console.log("Status:", resposta.status);
                console.log("Resposta:", resultado);

                if (!resposta.ok) {
                    let detalhe = `Erro HTTP ${resposta.status}`;

                    if (resultado && typeof resultado === "object") {
                        if (resultado.detail) {
                            detalhe = Array.isArray(resultado.detail)
                                ? resultado.detail.map(erro => erro.msg).join(", ")
                                : resultado.detail;
                        }
                    }

                    throw new Error(detalhe);
                }

                mostrarMensagem(
                    "Cliente cadastrado com sucesso!",
                    "sucesso"
                );

                formCliente.reset();

                await carregarClientes();

            } catch (erro) {
                console.error("Erro ao cadastrar cliente:", erro);

                if (erro instanceof TypeError) {
                    mostrarMensagem(
                        "Erro de conexão com o servidor. Verifique se o FastAPI está funcionando.",
                        "erro"
                    );
                } else {
                    mostrarMensagem(
                        `Erro ao cadastrar: ${erro.message}`,
                        "erro"
                    );
                }

            } finally {
                botaoCadastrar.disabled = false;
                botaoCadastrar.textContent = "Cadastrar";
            }
        });

        carregarClientes();
    </script>
</body>
</html>
