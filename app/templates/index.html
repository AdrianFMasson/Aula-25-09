<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="window-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>

        <div class="conteudo">
            <header>
                <h1>Cadastro de Clientes</h1>
            </header>

            <div id="mensagem" class="mensagem"></div>

            <form id="formCliente">
                <div class="campos-grid">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" autocomplete="off">
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" autocomplete="off" disabled>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" inputmode="numeric" autocomplete="off" disabled>
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" autocomplete="off" disabled>
                    </div>
                </div>

                <div class="acoes">
                    <button id="btnEnviar" type="button">Cadastrar</button>
                </div>
            </form>

            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Cidade</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela">
                        <!-- Linhas inseridas dinamicamente via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const inputNome = document.getElementById('nome');
        const inputEmail = document.getElementById('email');
        const inputTelefone = document.getElementById('telefone');
        const inputCidade = document.getElementById('cidade');
        const btnEnviar = document.getElementById('btnEnviar');
        const corpoTabela = document.getElementById('corpoTabela');
        const mensagemDiv = document.getElementById('mensagem');

        // ---------- Liberação sequencial dos campos ----------
        function atualizarLiberacao() {
            if (inputNome.value.trim().length > 0) {
                inputEmail.disabled = false;
            } else {
                inputEmail.disabled = true;
                inputEmail.value = '';
            }

            if (!inputEmail.disabled && inputEmail.value.trim().length > 0) {
                inputTelefone.disabled = false;
            } else {
                inputTelefone.disabled = true;
                inputTelefone.value = '';
            }

            if (!inputTelefone.disabled && inputTelefone.value.trim().length > 0) {
                inputCidade.disabled = false;
            } else {
                inputCidade.disabled = true;
                inputCidade.value = '';
            }
        }

        inputNome.addEventListener('input', atualizarLiberacao);
        inputEmail.addEventListener('input', atualizarLiberacao);
        inputTelefone.addEventListener('input', atualizarLiberacao);

        // ---------- Máscara de telefone ----------
        function formatarTelefone(valor) {
            valor = valor.replace(/\D/g, '');
            valor = valor.slice(0, 11);

            if (valor.length > 10) {
                valor = valor.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, '($1) $2-$3');
            } else if (valor.length > 6) {
                valor = valor.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
            } else if (valor.length > 2) {
                valor = valor.replace(/^(\d{2})(\d{0,5}).*/, '($1) $2');
            } else if (valor.length > 0) {
                valor = valor.replace(/^(\d*)/, '($1');
            }

            return valor;
        }

        inputTelefone.addEventListener('input', (e) => {
            const posicaoCursor = e.target.selectionStart;
            const tamanhoAntes = e.target.value.length;
            e.target.value = formatarTelefone(e.target.value);
            const tamanhoDepois = e.target.value.length;
            const novaPosicao = posicaoCursor + (tamanhoDepois - tamanhoAntes);
            e.target.setSelectionRange(novaPosicao, novaPosicao);
        });

        inputTelefone.addEventListener('keypress', (e) => {
            if (!/[0-9]/.test(e.key)) {
                e.preventDefault();
            }
        });

        // ---------- Mensagens de feedback ----------
        function mostrarMensagem(texto, tipo) {
            mensagemDiv.textContent = texto;
            mensagemDiv.className = 'mensagem ' + tipo;
            setTimeout(() => {
                mensagemDiv.textContent = '';
                mensagemDiv.className = 'mensagem';
            }, 3500);
        }

        // ---------- Renderização da tabela ----------
        function renderizarTabela(clientes) {
            corpoTabela.innerHTML = '';
            clientes.forEach((cliente) => {
                const linha = document.createElement('tr');
                linha.innerHTML = `
                    <td>${cliente.nome}</td>
                    <td>${cliente.email}</td>
                    <td>${cliente.telefone}</td>
                    <td>${cliente.cidade}</td>
                `;
                corpoTabela.appendChild(linha);
            });
        }

        async function carregarClientes() {
            try {
                const resposta = await fetch('/api/clientes');
                const dados = await resposta.json();
                if (resposta.ok) {
                    renderizarTabela(dados);
                }
            } catch (erro) {
                console.error('Erro ao carregar clientes:', erro);
            }
        }

        // ---------- Envio do formulário ----------
        async function enviarCadastro() {
            const nome = inputNome.value.trim();
            const email = inputEmail.value.trim();
            const telefone = inputTelefone.value.trim();
            const cidade = inputCidade.value.trim();

            if (!nome || !email || !telefone || !cidade) {
                mostrarMensagem('Preencha todos os campos antes de enviar.', 'erro');
                return;
            }

            btnEnviar.disabled = true;

            try {
                const resposta = await fetch('/api/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, telefone, cidade })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    mostrarMensagem('Cliente cadastrado com sucesso!', 'sucesso');
                    inputNome.value = '';
                    inputEmail.value = '';
                    inputTelefone.value = '';
                    inputCidade.value = '';
                    atualizarLiberacao();
                    inputNome.focus();
                    await carregarClientes();
                } else {
                    mostrarMensagem(dados.erro || 'Erro ao cadastrar cliente.', 'erro');
                }
            } catch (erro) {
                mostrarMensagem('Erro de conexão com o servidor.', 'erro');
                console.error(erro);
            } finally {
                btnEnviar.disabled = false;
            }
        }

        btnEnviar.addEventListener('click', enviarCadastro);

        document.addEventListener('DOMContentLoaded', () => {
            atualizarLiberacao();
            carregarClientes();
        });
    </script>
</body>
</html>
